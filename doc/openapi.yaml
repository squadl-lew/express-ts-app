openapi: 3.0.3
info:
  title: express-ts-app — POS Sederhana
  description: API POS sederhana untuk management penjual. Single user. CRUD Product, dengan MySQL + Prisma 5.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/products:
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseWrapper'
        '400':
          description: Validation error
    get:
      summary: Search products
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
  /api/products/{productId}:
    get:
      summary: Get product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseWrapper'
        '404':
          description: Product not found
    put:
      summary: Update product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseWrapper'
        '400':
          description: Validation error
        '404':
          description: Product not found
    delete:
      summary: Remove product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: OK
        '404':
          description: Product not found
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        buyPrice:
          type: integer
          description: Harga beli / modal, dalam Rupiah
        sellPrice:
          type: integer
          description: Harga jual, dalam Rupiah
        stock:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [name, category, buyPrice, sellPrice]
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        buyPrice:
          type: integer
          minimum: 0
        sellPrice:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
    UpdateProductRequest:
      type: object
      required: [name, category, buyPrice, sellPrice, stock]
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        buyPrice:
          type: integer
          minimum: 0
        sellPrice:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
    ProductResponseWrapper:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        paging:
          type: object
          properties:
            current_page:
              type: integer
            total_page:
              type: integer
            size:
              type: integer
